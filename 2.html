<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2-Oltin qoida</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg,#160b28,#49234f,#100d28);
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
}

.card {
    width: 100%;
    max-width: 800px;
    padding: 45px 30px;
    text-align: center;
    border: 2px solid #ff91c8;
    border-radius: 30px;
    background: #ffffff12;
    backdrop-filter: blur(15px);
    box-shadow: 0 0 50px #ff65b533;
    animation: appear 1s ease;
}

.number {
    color: #ff9dce;
    font-size: 23px;
    font-weight: bold;
}

.icon {
    font-size: 90px;
    margin: 25px 0;
    animation: heartbeat 2s infinite;
    filter: drop-shadow(0 0 20px #ff65b5);
}

h1 {
    color: #ff9dce;
    font-size: clamp(28px,6vw,45px);
    margin-bottom: 25px;
}

p {
    color: #f0dff0;
    font-size: 18px;
    line-height: 2;
}

.quote {
    margin-top: 30px;
    padding: 25px;
    border-radius: 20px;
    background: #ff65b518;
    color: #ffb4d9;
    font-size: 21px;
    font-weight: bold;
}

button {
    margin-top: 30px;
    padding: 16px 35px;
    border: none;
    border-radius: 30px;
    background: linear-gradient(135deg,#ffc0df,#e65a9d);
    color: #32112a;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: .3s;
}

button:hover {
    transform: scale(1.08);
    box-shadow: 0 0 30px #ff65b5;
}

#message {
    color: #ffb4d9;
    margin-top: 25px;
    font-size: 19px;
    font-weight: bold;
}

.back {
    display: inline-block;
    margin-top: 25px;
    color: #ffb4d9;
    text-decoration: none;
}

@keyframes heartbeat {
    0%,100% {transform: scale(1);}
    50% {transform: scale(1.15);}
}

@keyframes appear {
    from {opacity:0;transform:translateY(40px);}
    to {opacity:1;transform:translateY(0);}
}
</style>
</head>

<body>

<canvas class="stars" id="stars"></canvas>

<div class="card">

<div class="number">💗 02-OLTIN QOIDA 💗</div>

<div class="icon">❤️</div>

<h1>MEHRIBON BO‘LAMAN</h1>

<p>
Men barcha insonlarga mehribon bo‘laman.
Do‘stlarimga yordam beraman,
qiynalganlarga ko‘maklashaman.

Hech kimni xafa qilmayman,
barchaga yaxshi munosabatda bo‘laman.
Mehr va yaxshilik ulashaman.
</p>

<div class="quote">
"Mehr bergan inson — mehr topadi!"
</div>

<button onclick="promise()">
❤️ MEN BU QOIDAGA AMAL QILAMAN
</button>

<div id="message"></div>

<a class="back" href="index.html">
⬅ Bosh sahifaga qaytish
</a>

</div>

<script>
// Yurak va yulduzlar uchun fon

const canvas = document.getElementById("stars");
const ctx = canvas.getContext("2d");

let stars = [];

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    stars = [];

    for(let i = 0; i < 100; i++) {
        stars.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            r: Math.random() * 2,
            speed: Math.random() * 0.5 + 0.1
        });
    }
}

function animate() {
    ctx.clearRect(0,0,canvas.width,canvas.height);

    stars.forEach(s => {
        ctx.beginPath();
        ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
        ctx.fillStyle = "#ff9dce";
        ctx.fill();

        s.y -= s.speed;

        if(s.y < 0) {
            s.y = canvas.height;
            s.x = Math.random() * canvas.width;
        }
    });

    requestAnimationFrame(animate);
}

window.addEventListener("resize",resize);
resize();
animate();

// Mehribonlik va'dasi

function promise() {
    document.getElementById("message").innerHTML =
    "❤️ Men doimo mehribon va oqko‘ngil bo‘laman!";

    for(let i = 0; i < 35; i++) {
        let el = document.createElement("div");

        el.innerHTML = ["❤️","💗","💕","✨","🌸"][
            Math.floor(Math.random()*5)
        ];

        el.style.position = "fixed";
        el.style.left = Math.random()*100 + "vw";
        el.style.top = "-30px";
        el.style.fontSize = "25px";
        el.style.zIndex = "9999";
        el.style.pointerEvents = "none";

        document.body.appendChild(el);

        let x = Math.random()*200-100;

        el.animate([
            {transform:"translateY(0)",opacity:1},
            {transform:`translate(${x}px,100vh)`,opacity:0}
        ],{
            duration:3000,
            easing:"ease-in"
        }).onfinish = () => el.remove();
    }
}
</script>

</body>
</html>
